name: test

on:
  push:
  pull_request:

jobs:
  shell-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: bash 语法检查
        shell: bash
        run: |
          set -e
          for f in plugins/session-sync/scripts/*.sh; do bash -n "$f"; done
          bash -n test/e2e.sh
      - name: end-to-end 回归测试(真实平台;Window 用 Git Bash 的 bash + perl)
        shell: bash
        run: bash test/e2e.sh